name: Build check

on:
  push:
    branches:
      - main
      - develop/vxnci-foundation
  pull_request:
    branches:
      - main
      - develop/vxnci-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
