name: Build check

on:
  push:
    branches:
      - main
      - develop/vxnci-foundation
  pull_request:
    branches:
      - main
      - develop/vxnci-foundation

permissions:
  contents: read

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependency
        run: python -m pip install -r requirements-training.txt
      - name: Run model and tokenizer tests
        run: |
          python -m unittest discover -s tests -p 'test_model.py' -v
          python -m unittest discover -s tests -p 'test_tokenizer.py' -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build application
        run: npm run build
