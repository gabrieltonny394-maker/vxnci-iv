name: Build check

on:
  push:
    branches:
      - main
      - develop/vxnci-foundation
  pull_request:
    branches:
      - main
      - develop/vxnci-foundation

permissions:
  contents: read

jobs:
  python-model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install checkpoint dependency
        run: python -m pip install numpy safetensors
      - name: Run tokenizer tests
        run: python -m unittest discover -s tests -p 'test_tokenizer.py' -v
      - name: Run model tests
        run: python -m unittest discover -s tests -p 'test_model.py' -v
      - name: Run dataset registry tests
        run: python -m unittest discover -s tests -p 'test_dataset_registry.py' -v
      - name: Run training pipeline tests
        run: python -m unittest discover -s tests -p 'test_training.py' -v
      - name: Run benchmark harness tests
        run: python -m unittest discover -s tests -p 'test_benchmark.py' -v
      - name: Run task-success benchmark tests
        run: python -m unittest discover -s tests -p 'test_task_benchmark.py' -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build application
        run: npm run build
